site_name: Merlin Quantum Simulator
site_url: https://mark-koch.github.io/merlin-sim/
site_description: >-
  Merlin is a polynomial-time quantum simulator for non-Clifford quantum error
  correction. It simulates magic state distillation, magic state cultivation and
  code switching circuits built from CNOT, T and Pauli gates, in Python and Rust.
site_author: Serban Cercelescu, Mark Koch, Arthur Pesah
repo_url: https://github.com/mark-koch/merlin-sim
repo_name: mark-koch/merlin-sim

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.copy

nav:
  - Overview: index.md
  - Python API: api.md
  - Circuit Format: circuit-format.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - python
          options:
            docstring_style: google
            group_by_category: false
            members_order: source
            show_root_heading: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
