[project]
name = "merlin-sim"
version = "0.2.0"
description = "Merlin: polynomial-time quantum simulator for non-Clifford quantum error correction (magic state distillation, cultivation and code switching)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENCE"]
authors = [
    { name = "Serban Cercelescu" },
    { name = "Mark Koch" },
    { name = "Arthur Pesah" },
]
keywords = [
    "quantum",
    "quantum-simulator",
    "quantum-error-correction",
    "non-clifford",
    "magic-states",
    "magic-state-distillation",
    "magic-state-cultivation",
    "code-switching",
    "stabilizer",
    "phase-polynomial",
    "stim",
    "fault-tolerance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.1"]

[project.urls]
Homepage = "https://mark-koch.github.io/merlin-sim/"
Documentation = "https://mark-koch.github.io/merlin-sim/"
Repository = "https://github.com/mark-koch/merlin-sim"
Issues = "https://github.com/mark-koch/merlin-sim/issues"
Paper = "https://arxiv.org/abs/2610.06811"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[dependency-groups]
experiments = [
    "scipy>=1.14",
    "matplotlib>=3.10",
    "clifft==0.9.0; python_version >= '3.12'"
]
dev = [
    "maturin>=1.9,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.30",
    "pytest>=8.4",
]
benchmark = [
    "bloqade-tsim==0.1.5",
    "clifft==0.9.0; python_version >= '3.12'",
    "matplotlib>=3.10",
    "symft",
    "xtim; python_version >= '3.11'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "external: uses optional simulator installations",
    "slow: deliberately expensive full benchmark circuits",
]

[tool.maturin]
module-name = "merlin_sim._core"
python-source = "python"
python-packages = ["merlin_sim", "merlin"]
features = ["python"]

[tool.uv.sources]
symft = { path = "benchmarks/symft/python" }
xtim = { git = "https://github.com/ikim-quantum/xtim", rev = "89c550f" }
