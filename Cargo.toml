[package]
name = "merlin_sim"
version = "0.2.0"
edition = "2024"
description = "Merlin: polynomial-time quantum simulator for non-Clifford quantum error correction (CNOT+T phase-polynomial / DCP-stabilizer states)"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/mark-koch/merlin-sim"
homepage = "https://mark-koch.github.io/merlin-sim/"
documentation = "https://mark-koch.github.io/merlin-sim/"
keywords = ["quantum", "simulator", "qec", "non-clifford", "magic-states"]
categories = ["science", "simulation"]

[lib]
name = "merlin_sim"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:numpy", "dep:pyo3"]

[dependencies]
num-complex = "0.4"
numpy = { version = "0.29", optional = true }
pest = "2.8"
pest_derive = "2.8"
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
rand = "0.9"
rand_chacha = "0.9"

[profile.release]
debug = true
